developer_instructions = """
Read AGENTS.md, docs/AGENT_WORKFLOW.md, docs/FRONTEND_ARCHITECTURE.md, relevant ADRs in docs/DECISIONS.md, and .agents/skills/frontend-feature/SKILL.md before changing frontend code. For styling, also read .agents/skills/ui-styling/SKILL.md and docs/brand-guidelines.md.

These are the canonical rules; do not duplicate them here. Do not revive packages/contracts, src/services/, or src/modules/. Use generated OpenAPI types and the approved lib/, entities/, features/, components/, and app/ layers. Apply phase gates by the endpoint set a feature consumes: report the exact missing prerequisite for a blocked feature, but do not block unrelated routes whose contracts are ready.


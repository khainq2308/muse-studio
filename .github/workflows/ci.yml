name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-kit-check:
    name: Agent kit validation and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate links, skills, configs and script syntax
        run: python scripts/check_agent_assets.py
      - name: Check roadmap status consistency
        run: python scripts/check_docs_sync.py
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run lint and layering gate
        run: scripts/lint.sh
      - name: Run agent-kit guard unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/orchestrator/pyproject.toml
            apps/media-engine/pyproject.toml
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install orchestrator and media-engine test dependencies
        working-directory: apps/orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -e "../media-engine"
          pip install -e ".[dev]"
      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        env:
          REQUIRE_FFMPEG: "1"
        run: pytest -q -rs

  media-engine-tests:
    name: Media engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest
      - name: Run media engine tests
        working-directory: apps/media-engine
        run: PYTHONPATH=. pytest -q

  frontend-build:
    name: Studio web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/studio-web/package.json
      - name: Install dependencies
        working-directory: apps/studio-web
        run: npm install
      - name: Build frontend
        working-directory: apps/studio-web
        run: npm run build


  # Temporary lock-generation helper. Removed after committing the resulting uv.lock.
  generate-python-lock-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/python-uv-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Resolve project and local muse-media dependency
        run: uv lock --project apps/orchestrator
      - name: Print generated lock for recovery if artifact access is unavailable
        run: |
          echo "LOCKFILE_BEGIN"
          cat apps/orchestrator/uv.lock
          echo "LOCKFILE_END"
      - uses: actions/upload-artifact@v4
        with:
          name: python-uv-lock-bootstrap
          path: apps/orchestrator/uv.lock
          if-no-files-found: error
          retention-days: 3

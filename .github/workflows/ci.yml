name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-kit-check:
    name: Agent kit validation and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate links, skills, configs and script syntax
        run: python scripts/check_agent_assets.py
      - name: Check roadmap status consistency
        run: python scripts/check_docs_sync.py
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run lint and layering gate
        run: scripts/lint.sh
      - name: Run agent-kit guard unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/orchestrator/pyproject.toml
            apps/media-engine/pyproject.toml
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator and media-engine dependencies
        run: uv sync --locked --project apps/orchestrator --extra dev
      - name: Run orchestrator tests
        env:
          REQUIRE_FFMPEG: "1"
        run: uv run --locked --project apps/orchestrator --extra dev python -m pytest -p pytest_asyncio.plugin -q -rs

  media-engine-tests:
    name: Media engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest
      - name: Run media engine tests
        working-directory: apps/media-engine
        run: PYTHONPATH=. pytest -q

  frontend-build:
    name: Studio web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/studio-web/package.json
      - name: Install dependencies
        working-directory: apps/studio-web
        run: npm install
      - name: Build frontend
        working-directory: apps/studio-web
        run: npm run build

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-kit-check:
    name: Shared agent kit consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shared instructions, skill mirrors and local links
        run: python scripts/check_agent_assets.py

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/orchestrator/pyproject.toml
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install orchestrator and test dependencies
        working-directory: apps/orchestrator
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        env:
          # Real-render export tests must run here; a missing FFmpeg fails them instead of skipping.
          REQUIRE_FFMPEG: "1"
        run: pytest -q -rs

  media-engine-tests:
    name: Media engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest
      - name: Run media engine tests
        working-directory: apps/media-engine
        run: PYTHONPATH=. pytest -q

  frontend-build:
    name: Studio web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/studio-web/package.json
      - name: Install dependencies
        working-directory: apps/studio-web
        run: npm install
      - name: Build frontend
        working-directory: apps/studio-web
        run: npm run build

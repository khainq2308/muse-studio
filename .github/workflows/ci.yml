name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**", "docs/**", "test/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-kit-check:
    name: Agent kit validation and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Validate links, skills, configs and script syntax
        run: python scripts/check_agent_assets.py
      - name: Check roadmap status consistency
        run: python scripts/check_docs_sync.py
      - name: Install Ruff (version locked in apps/orchestrator/uv.lock)
        run: python -m pip install "ruff==0.17.1"
      - name: Run Python lint (whole tree) and layering gate
        run: scripts/lint.sh --python-only
      - name: Run agent-kit guard unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          SECRET_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef0123456789abcdef
          STUDIO_ADMIN_TOKEN: ci-only-admin-token
          MUSE2API_VIDEO_PAYLOAD_PROFILE: czg86389-hub
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production images
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          SECRET_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef0123456789abcdef
          STUDIO_ADMIN_TOKEN: ci-only-admin-token
          MUSE2API_VIDEO_PAYLOAD_PROFILE: czg86389-hub
        run: COMPOSE_PROJECT_NAME=musestudio-ci docker compose -f docker-compose.prod.yml build
      - name: Smoke-test production Studio Web Nginx and same-origin API proxy
        env:
          STUDIO_WEB_IMAGE: musestudio-ci-studio-web
        run: bash scripts/test_nginx_prod.sh

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/orchestrator/pyproject.toml
            apps/media-engine/pyproject.toml
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator and media-engine dependencies
        working-directory: apps/orchestrator
        run: uv sync --locked --project . --extra dev
      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        env:
          REQUIRE_FFMPEG: "1"
        run: uv run --locked --project . --extra dev python -m pytest -q -rs
      - name: Audit locked production Python dependencies
        # Blocking: any known vulnerability in a runtime dependency fails the build
        # (pip-audit has no severity filter). Dev extras and the local media package are excluded.
        run: |
          uv export --locked --project apps/orchestrator --no-dev --no-emit-project \
            --no-emit-package muse-media --format requirements-txt \
            -o "$RUNNER_TEMP/orchestrator-prod-requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/orchestrator-prod-requirements.txt"

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: muse_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muse_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator and media-engine dependencies
        working-directory: apps/orchestrator
        run: uv sync --locked --project . --extra dev
      - name: Run PostgreSQL integration tests (Alembic head, row locks, partial unique index)
        working-directory: apps/orchestrator
        env:
          PG_IT_USER: postgres
          PG_IT_PASSWORD: ci-only-postgres-password
          # A missing TEST_POSTGRES_URL fails the module instead of skipping it.
          REQUIRE_POSTGRES: "1"
        run: |
          # Each test creates and drops its own muse_it_<hex> database on this server.
          export TEST_POSTGRES_URL="postgresql+asyncpg://${PG_IT_USER}:${PG_IT_PASSWORD}@127.0.0.1:5432/muse_it"
          uv run --locked --project . --extra dev python -m pytest -q -p no:cacheprovider \
            tests/test_postgres_integration.py -rsx --junitxml="$RUNNER_TEMP/pg-it.xml"
          # Defense in depth: any skip (test- or module-level) proves nothing. Strict xfail
          # markers for known bugs are also <skipped> in JUnit, so only those are allowed.
          if grep -o '<skipped[^>]*>' "$RUNNER_TEMP/pg-it.xml" | grep -qv 'type="pytest.xfail"'; then
            echo "PostgreSQL integration tests were skipped; failing." >&2
            exit 1
          fi

  arq-e2e:
    name: Real Redis/ARQ worker end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator and media-engine dependencies
        working-directory: apps/orchestrator
        run: uv sync --locked --project . --extra dev
      - name: Run API + ARQ worker processes against real Redis (enqueue, dedupe, cancel, reply, recovery cron)
        working-directory: apps/orchestrator
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          # A missing TEST_REDIS_URL fails the module instead of skipping it.
          REQUIRE_ARQ_E2E: "1"
        run: |
          uv run --locked --project . --extra dev python -m pytest -q -p no:cacheprovider \
            tests/test_arq_e2e.py -rsx --junitxml="$RUNNER_TEMP/arq-e2e.xml"
          if grep -q '<skipped' "$RUNNER_TEMP/arq-e2e.xml"; then
            echo "Real Redis/ARQ end-to-end tests were skipped; failing." >&2
            exit 1
          fi

  muse2api-contract:
    name: muse2api gateway contract (mock driver)
    runs-on: ubuntu-latest
    env:
      # Public upstream gateway revision the adapter contract is verified against (mock
      # driver). The first-frame patch and readyz capability live in the private
      # khainq2308/muse2api, which CI cannot check out; verify those live (ops runbook).
      MUSE2API_REF: 949f326443bcc687dbf25118391cf32b4712d734
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: www222fff/muse2api
          ref: ${{ env.MUSE2API_REF }}
          path: .muse2api
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator dependencies
        working-directory: apps/orchestrator
        run: uv sync --locked --project . --extra dev
      - name: Start muse2api with the offline mock driver
        run: |
          python -m venv "$RUNNER_TEMP/muse2api-venv"
          "$RUNNER_TEMP/muse2api-venv/bin/pip" install --quiet ./.muse2api
          mkdir -p "$RUNNER_TEMP/muse2api-data"
          MUSE2API_DRIVER=mock MUSE2API_HOST=127.0.0.1 MUSE2API_PORT=18610 \
            MUSE2API_DATA_DIR="$RUNNER_TEMP/muse2api-data" MUSE2API_API_KEY=ci-contract-key \
            nohup "$RUNNER_TEMP/muse2api-venv/bin/python" -m muse2api > "$RUNNER_TEMP/muse2api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18610/readyz && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/muse2api.log"
          exit 1
      - name: Run adapter contract tests against the gateway
        working-directory: apps/orchestrator
        env:
          MUSE2API_CONTRACT_URL: http://127.0.0.1:18610
          MUSE2API_CONTRACT_KEY: ci-contract-key
          MUSE2API_CONTRACT_REQUIRE: "1"
          MUSE2API_CONTRACT_TIMEOUT: "120"
        run: uv run --locked --project . --extra dev python -m pytest -q -rs tests/test_muse2api_contract.py

  openapi-contract:
    name: OpenAPI export and frontend type generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator dependencies
        run: uv sync --locked --project apps/orchestrator --extra dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/studio-web
        run: npm ci --no-audit --no-fund
      - name: Check committed OpenAPI snapshot
        run: uv run --locked --project apps/orchestrator --extra dev python scripts/export_openapi.py --check
      - name: Require typed success responses for every API route
        run: python scripts/audit_openapi_responses.py --strict
      - name: Audit response_model declarations for queue and batch routers
        run: python scripts/audit_api_response_models.py --report --require-typed projects --require-typed connections --require-typed assets --require-typed pipeline --require-typed workflows --require-typed queue --require-typed batch --require-typed timeline --require-typed connection_accounts --require-typed metrics --require-typed maintenance --require-typed backups --require-typed system
      - name: Check generated frontend TypeScript schema
        working-directory: apps/studio-web
        run: npm run gen:api:check
      - name: Ensure generation left the working tree clean
        run: git diff --exit-code -- apps/orchestrator/openapi.json apps/studio-web/src/lib/api/schema.d.ts

  media-engine-tests:
    name: Media engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install "pytest==9.1.1"
      - name: Run media engine tests
        working-directory: apps/media-engine
        run: PYTHONPATH=. pytest -q

  frontend-build:
    name: Studio web lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/studio-web
        run: npm ci --no-audit --no-fund
      - name: Audit production frontend dependencies
        working-directory: apps/studio-web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint frontend
        working-directory: apps/studio-web
        run: npm run lint
      - name: Check frontend formatting
        working-directory: apps/studio-web
        run: npm run format:check
      - name: Run frontend unit tests
        working-directory: apps/studio-web
        run: npm test
      - name: Build production frontend
        working-directory: apps/studio-web
        env:
          VITE_ORCHESTRATOR_URL: "."
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/studio-web
        run: npx playwright install --with-deps chromium
      - name: Run production preview smoke test
        working-directory: apps/studio-web
        env:
          CI: "true"
          VITE_ORCHESTRATOR_URL: "."
        run: npm run test:e2e
      - name: Upload Queue Monitor screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queue-monitor-ui-evidence
          path: apps/studio-web/test-results/queue-monitor.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload module viewport screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-web-viewport-evidence
          path: apps/studio-web/test-results/ui-evidence/
          if-no-files-found: ignore
          retention-days: 7

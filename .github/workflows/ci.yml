name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-kit-check:
    name: Agent kit validation and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Validate links, skills, configs and script syntax
        run: python scripts/check_agent_assets.py
      - name: Check roadmap status consistency
        run: python scripts/check_docs_sync.py
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run Python lint and layering gate
        run: scripts/lint.sh --python-only
      - name: Run agent-kit guard unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          SECRET_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef0123456789abcdef
          STUDIO_ADMIN_TOKEN: ci-only-admin-token
          MUSE2API_VIDEO_PAYLOAD_PROFILE: czg86389-hub
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production images
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          SECRET_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef0123456789abcdef
          STUDIO_ADMIN_TOKEN: ci-only-admin-token
          MUSE2API_VIDEO_PAYLOAD_PROFILE: czg86389-hub
        run: docker compose -f docker-compose.prod.yml build

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/orchestrator/pyproject.toml
            apps/media-engine/pyproject.toml
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked orchestrator and media-engine dependencies
        working-directory: apps/orchestrator
        run: uv sync --locked --project . --extra dev
      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        env:
          REQUIRE_FFMPEG: "1"
        run: uv run --locked --project . --extra dev python -m pytest -q -rs

  media-engine-tests:
    name: Media engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest
      - name: Run media engine tests
        working-directory: apps/media-engine
        run: PYTHONPATH=. pytest -q

  frontend-build:
    name: Studio web lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/studio-web
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        working-directory: apps/studio-web
        run: npm run lint
      - name: Temporary formatter capture
        working-directory: apps/studio-web
        run: |
          npx prettier --write scripts/check_frontend_boundaries.mjs src/lib/api/client.ts src/lib/api/client.test.ts
          echo "PRETTIER_BOUNDARY_BEGIN"
          cat scripts/check_frontend_boundaries.mjs
          echo "PRETTIER_BOUNDARY_END"
          echo "PRETTIER_CLIENT_BEGIN"
          cat src/lib/api/client.ts
          echo "PRETTIER_CLIENT_END"
          echo "PRETTIER_TEST_BEGIN"
          cat src/lib/api/client.test.ts
          echo "PRETTIER_TEST_END"
      - name: Check frontend formatting
        working-directory: apps/studio-web
        run: npm run format:check
      - name: Run frontend unit tests
        working-directory: apps/studio-web
        run: npm test
      - name: Build production frontend
        working-directory: apps/studio-web
        env:
          VITE_ORCHESTRATOR_URL: "."
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/studio-web
        run: npx playwright install --with-deps chromium
      - name: Run production preview smoke test
        working-directory: apps/studio-web
        env:
          CI: "true"
          VITE_ORCHESTRATOR_URL: "."
        run: npm run test:e2e

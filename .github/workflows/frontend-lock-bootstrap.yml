name: Temporary frontend lockfile bootstrap

on:
  push:
    branches:
      - feat/frontend-foundation-phase-0a
    paths:
      - "apps/studio-web/package.json"
      - ".github/workflows/frontend-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate npm lockfile using the npm resolver
        working-directory: apps/studio-web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the generated lockfile to this feature branch
        shell: bash
        run: |
          if git diff --quiet -- apps/studio-web/package-lock.json; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio-web/package-lock.json
          git commit -m "chore(frontend): generate npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Generate Python dependency lock

on:
  push:
    branches: [chore/python-uv-lockfile]

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Resolve the orchestrator and local media-engine packages
        run: uv lock --project apps/orchestrator
      - name: Validate the generated lock
        run: uv lock --check --project apps/orchestrator
      - uses: actions/upload-artifact@v4
        with:
          name: python-uv-lock
          path: apps/orchestrator/uv.lock
          if-no-files-found: error
          retention-days: 3

name: Temporary Phase 0c generated contracts

on:
  push:
    branches: ["chore/phase-0c-contracts-generation"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Sync locked Python dependencies
        run: uv sync --locked --project apps/orchestrator --extra dev
      - name: Regenerate OpenAPI snapshot
        run: uv run --locked --project apps/orchestrator --extra dev python scripts/export_openapi.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Install locked frontend dependencies and regenerate TypeScript
        working-directory: apps/studio-web
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
      - name: Commit generated contract artifacts to this temporary branch
        run: |
          git add apps/orchestrator/openapi.json apps/studio-web/src/lib/api/schema.d.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate Phase 0c OpenAPI contracts"
            git push origin HEAD:chore/phase-0c-contracts-generation
          fi

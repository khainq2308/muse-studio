name: Temporary OpenAPI lock generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate exact CLI dependency using npm
        working-directory: apps/studio-web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact openapi-typescript@7.13.0
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-typescript-lock
          path: |
            apps/studio-web/package.json
            apps/studio-web/package-lock.json

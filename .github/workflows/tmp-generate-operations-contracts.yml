name: Temporary operations contract generation

on:
  push:
    branches:
      - feat/phase-0c-operations-contracts
    paths:
      - "apps/orchestrator/muse_orchestrator/api/**"
      - "apps/orchestrator/tests/test_api_response_contracts.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-0c-operations-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
      - name: Install locked orchestrator dependencies
        run: uv sync --locked --project apps/orchestrator --extra dev
      - name: Export OpenAPI snapshot
        run: uv run --locked --project apps/orchestrator --extra dev python scripts/export_openapi.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/studio-web
        run: npm ci --no-audit --no-fund
      - name: Generate frontend TypeScript schema
        working-directory: apps/studio-web
        run: npm run gen:api
      - name: Commit generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orchestrator/openapi.json apps/studio-web/src/lib/api/schema.d.ts
          if git diff --cached --quiet; then
            echo "Generated OpenAPI and TypeScript contracts are already current."
          else
            git commit -m "chore(api): regenerate operations response contracts"
            git push origin HEAD:feat/phase-0c-operations-contracts
          fi

name: Temporary Phase 0c contract generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-contracts:
    name: Generate OpenAPI and TypeScript contracts from updated routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: |
            apps/orchestrator/pyproject.toml
            apps/orchestrator/uv.lock
            apps/media-engine/pyproject.toml
      - name: Install locked orchestrator dependencies
        run: uv sync --locked --project apps/orchestrator --extra dev
      - name: Export OpenAPI snapshot
        run: uv run --locked --project apps/orchestrator --extra dev python scripts/export_openapi.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio-web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/studio-web
        run: npm ci --no-audit --no-fund
      - name: Generate TypeScript schema
        working-directory: apps/studio-web
        run: npm run gen:api
      - name: Commit generated contract artifacts to the PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+khainq2308@users.noreply.github.com"
          git add apps/orchestrator/openapi.json apps/studio-web/src/lib/api/schema.d.ts
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate OpenAPI contracts after Phase 0c consolidation"
            git push origin "HEAD:$TARGET_BRANCH"
          else
            echo "Generated OpenAPI artifacts are already up to date."
          fi

name: Temporary OpenAPI dependency lock bootstrap

on:
  pull_request:
    branches: ["feat/phase-0b-openapi-pipeline"]

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate dependency lock with npm
        working-directory: apps/studio-web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact openapi-typescript@7.13.0
      - name: Commit the package-manager generated files to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio-web/package.json apps/studio-web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock openapi-typescript CLI dependency"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["muse_orchestrator*"]
exclude = ["migrations*"]

[project]
name = "muse-orchestrator"
version = "0.1.0"
description = "MuseStudio Central Orchestration API & Async Worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "httpx[socks]>=0.27.2",
    "arq>=0.26.1",
    "muse-media>=0.1.0",
    "cryptography>=43.0.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

# Correctness-focused lint gate run by scripts/lint.sh and CI on the whole Python tree.
# Broad style rules are intentionally not enabled yet; widen `select` only with a clean tree.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


# Resolve the monorepo media package locally rather than from a public index.
[tool.uv.sources]
muse-media = { path = "../media-engine", editable = true }

server {
    # 8080 (not 80) so nginx can run as the non-root "nginx" user.
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Small default request-body limit; only the upload and restore endpoints below allow
    # large bodies. The orchestrator remains the authority for per-endpoint limits.
    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    # Keep API calls same-origin so production deployments do not require a broad CORS policy.
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Asset upload: MAX_UPLOAD_SIZE_BYTES is 150 MiB (services/asset_storage.py) plus
    # multipart overhead. Stream the body instead of spooling it to nginx disk first.
    location = /api/v1/assets/upload {
        client_max_body_size 160m;
        proxy_request_buffering off;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Backup restore: BACKUP_MAX_BYTES is 500 MiB (services/backup_service.py) plus
    # multipart overhead; restoring a large archive can take several minutes.
    location = /api/v1/backups/restore {
        client_max_body_size 520m;
        proxy_request_buffering off;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /healthz {
        proxy_pass http://orchestrator-api:8000/healthz;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Readiness (database + Redis) must reach the API; without this block the SPA fallback
    # below would answer 200 with index.html even when the backend is down.
    location = /readyz {
        proxy_pass http://orchestrator-api:8000/readyz;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite emits content-hashed files here; a missing asset must 404, not fall back to HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The SPA shell must always be revalidated so new deployments pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    # 8080 (not 80) so nginx can run as the non-root "nginx" user.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for every response from this server. Nginx only inherits
    # add_header into a location that defines none of its own, so locations that add
    # Cache-Control include the same set via repetition below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Keep API calls same-origin so production deployments do not require a broad CORS policy.
    location /api/ {
        # Backups may be up to 500 MiB (BACKUP_MAX_BYTES in backup_service.py) and travel as
        # multipart form data; allow headroom for multipart overhead. Uploads (150 MiB) fit too.
        # The orchestrator remains the authority that enforces per-endpoint limits.
        client_max_body_size 520m;
        # Stream large uploads/restores to the API instead of spooling them to nginx disk first.
        proxy_request_buffering off;
        proxy_pass http://orchestrator-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Restore of a large archive can take several minutes to send and process.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /healthz {
        proxy_pass http://orchestrator-api:8000/healthz;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed files here; a missing asset must 404, not fall back to HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # The SPA shell must always be revalidated so new deployments pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Shared same-origin API proxy settings. API responses carry admin-scoped data, so they
# must never be stored by the browser or intermediary caches.
proxy_pass http://orchestrator-api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
# Stream large responses (backup/asset downloads) instead of spooling them to nginx temp
# files; the production container keeps /var/cache/nginx on a small tmpfs.
proxy_max_temp_file_size 0;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/security-headers.conf;

# Baseline security headers. nginx only inherits add_header into a location that declares
# none of its own, so every location that adds a header must include this file again.
# The SPA build has no inline scripts or styles (checked by scripts/test_nginx_prod.sh);
# React style props are applied through CSSOM, which style-src 'self' permits.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
